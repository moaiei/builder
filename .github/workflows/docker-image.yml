name: Build Container Image

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
    tags:
      - "*"

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Branch
        run: |
          export APPS_JSON='[{"url": "https://github.com/${{ github.repository }}","branch": "${{ github.ref_name }}"}]'
          echo "APPS_JSON_BASE64=$(echo $APPS_JSON | base64 -w 0)" >> $GITHUB_ENV
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.ref_name }}" == "master" ]]; then
            echo "FRAPPE_BRANCH=version-15" >> $GITHUB_ENV
          else
            echo "FRAPPE_BRANCH=develop" >> $GITHUB_ENV
          fi

      - name: Set Image Tag
        run: |
          if [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "STABLE_TAG=nightly" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=v15" >> $GITHUB_ENV
            echo "STABLE_TAG=stable" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: builds
          file: builds/images/layered/Containerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
            ghcr.io/${{ github.repository }}:${{ env.STABLE_TAG }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}
